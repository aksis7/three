<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Quiz — fullscreen</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
    body{background:#0f1620;color:#fff;min-height:100vh;overflow:hidden}
    /* Канвас на весь экран */
    #canvas-container{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0f1620}
    #canvas-container{touch-action:pan-y pinch-zoom}
    #canvas-container canvas{width:100%;height:100%;display:block}

    /* Прозрачное окно (HUD) */
    #hud{position:fixed;left:20px;bottom:20px;max-width:min(520px,calc(100vw - 40px));
         background:rgba(15,22,32,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
         border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 18px;display:flex;gap:12px;flex-direction:column;}
    #hud.hidden{display:none}
    #question{font-size:16px;font-weight:600;line-height:1.35}
    #quiz-controls{display:flex;gap:10px;margin-top:8px}
    .btn{padding:10px 14px;border:none;border-radius:12px;font-weight:700;cursor:pointer}
    #start-btn{background:linear-gradient(90deg,#ffb700,#ffe178);color:#222}
    #start-btn:hover{transform:translateY(-1px);box-shadow:0 8px 16px rgba(255,223,0,.28)}

    .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.45);z-index:2}
    .spinner{width:42px;height:42px;border:5px solid rgba(255,255,255,.15);border-top-color:#ffcc00;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media (max-width:560px){#hud{left:12px;right:12px;bottom:12px;max-width:none}}
  </style>
</head>
<body>
  <!-- Только 3D-сцена -->
  <div id="canvas-container">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Загрузка сцены…</div>
    </div>
  </div>

  <!-- Прозрачное окно с вопросами (появится после «Старт») -->
  <div id="hud">
    <div id="question">Нажмите «Старт», чтобы начать</div>
    <div id="quiz-controls"><button id="start-btn" class="btn">Старт</button></div>
  </div>

  <!-- Three.js r139 и загрузчики одной версии -->
  <script src="https://unpkg.com/three@0.139.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/utils/WorkerPool.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/KTX2Loader.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://unpkg.com/meshoptimizer@0.25.0/meshopt_decoder.js"></script>

  <script>
  let scene,camera,renderer,controls;let ambientLight,directionalLight;let gltfLoader;let model=null;let quizActive=false;let currentArrows=[];let stepIndex=0;const keys={w:false,a:false,s:false,d:false,shift:false,space:false,ctrl:false};const clock=new THREE.Clock();const containerEl=document.getElementById('canvas-container');
  // Фиксированная область видимости для всех устройств (letterbox / pillarbox)
  function computeSafeAspect(){ return (window.innerWidth >= window.innerHeight) ? 16/9 : 9/16; }
  let SAFE_ASPECT = computeSafeAspect(); // авто: 16:9 в альбомной, 9:16 в портретной ориентации
  function fitRenderer(){
    const W = window.innerWidth, H = window.innerHeight;
    const a = SAFE_ASPECT;
    let stageW, stageH;
    if (W / H > a) { stageH = H; stageW = Math.round(H * a); }
    else           { stageW = W; stageH = Math.round(W / a); }
    renderer.setSize(stageW, stageH, false);
    const c = renderer.domElement; c.style.width = stageW+'px'; c.style.height = stageH+'px';
  }
  let answerLock=false; // блокируем повторные клики во время анимации

  // --- Фиксация камеры во время вопросов ---
  const FIX_CAMERA_DURING_QUESTIONS = true; // можно выключить при необходимости
  let freeLook = true; // до старта свободный обзор; во время вопросов — запретим

  const QUIZ={steps:[
    {question:'Вы хотите продолжить движение прямо, какую полосу выберете?',options:[
      {id:'left',pos:[-38.275,-1.520,-75.911],color:'#ff3b30',correct:true},
      {id:'forward',pos:[-41.325,-1.520,-75.007],color:'#ff3b30',correct:true},
      {id:'right',pos:[-44.346,-1.520,-75.106],color:'#ff3b30',correct:false}]},
    {question:'Вы хотите повернуть на перекрёстке налево. Какую полосу выберете?',options:[
      {id:'left',pos:[-38.667,-1.520,-47.591],color:'#ff3b30',correct:true},
      {id:'forward',pos:[-41.700,-1.520,-47.023],color:'#ff3b30',correct:false},
      {id:'right',pos:[-44.295,-1.520,-46.767],color:'#ff3b30',correct:false}]},
    {question:'Где остановиться на красный сигнал светофора?',options:[
      {id:'stop_line',pos:[-32.442,-1.500,22.350],color:'#4cd964',correct:true},
      {id:'traffic_light',pos:[-33.512,-1.520,26.255],color:'#ff3b30',correct:false}]}
  ]};

  const STEP_VIEW_POSITIONS=[
    new THREE.Vector3(-41.315,1.6,-75.341-6),
    new THREE.Vector3(-41.554,1.6,-47.127-6),
    new THREE.Vector3(-32.977,1.6,24.303-6)
  ];
  const STEP_LOOK_AT=[
    new THREE.Vector3(-41.315,0.0,-75.341),
    new THREE.Vector3(-41.554,0.0,-47.127),
    new THREE.Vector3(-32.977,0.0,24.303)
  ];

  let smoothMove=false;let cameraTarget=null;
  function moveCameraToStep(index) {
  const viewPos = STEP_VIEW_POSITIONS[index];
  const lookAt  = STEP_LOOK_AT[index];
  if (!viewPos) return;

  // Базовая дистанция (как было раньше)
  const baseDist = viewPos.clone().sub(lookAt).length();

  // Оси относительно дороги
  const forward = lookAt.clone().sub(viewPos).normalize();
  const up = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(up, forward).normalize();

  // Горизонтальная FOV с учётом выбранного аспекта
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * SAFE_ASPECT);

  // Полуширина разброса вариантов поперёк дороги
  const step = QUIZ.steps[index];
  let halfWidth = 0;
  if (step && step.options) {
    for (const opt of step.options) {
      const p = new THREE.Vector3(opt.pos[0], opt.pos[1], opt.pos[2]);
      const lateral = p.clone().sub(lookAt).dot(right);
      halfWidth = Math.max(halfWidth, Math.abs(lateral));
    }
  }
  halfWidth += 0.8; // небольшой запас

  // Минимальная дистанция до центра, чтобы всё влезло по ширине
  const minDist = halfWidth / Math.tan(hFov / 2);
  const targetDist = Math.max(baseDist, minDist);

  const targetPos = lookAt.clone().addScaledVector(forward, -targetDist);
  targetPos.y = viewPos.y;

  const obj = controls.getObject();
  if (smoothMove) {
    cameraTarget = targetPos.clone();
  } else {
    obj.position.copy(targetPos);
    cameraTarget = null;
  }

  if (lookAt) obj.lookAt(lookAt);
}


  function createArrowSprite(color='#ff3b30'){const svg=encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,10 90,60 70,60 70,90 30,90 30,60 10,60' fill='${color}'/></svg>`);const texture=new THREE.TextureLoader().load(`data:image/svg+xml;utf8,${svg}`);const material=new THREE.SpriteMaterial({map:texture,transparent:true,depthWrite:false});return new THREE.Sprite(material)}
  function createRing(color=0xffffff,radius=0.5){const g=new THREE.RingGeometry(radius*0.65,radius,32);const m=new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide,transparent:true,opacity:0.9});const mesh=new THREE.Mesh(g,m);mesh.rotation.x=-Math.PI/2;return mesh}

  function setArrowVisual(group,mode='idle'){const ring=group.children[0],sprite=group.children[1];if(!ring||!sprite)return;if(mode==='idle'){ring.material.color.set(0xffffff);ring.material.opacity=0.9;sprite.material.opacity=1}else if(mode==='dim'){ring.material.color.set(0x666666);ring.material.opacity=0.6;sprite.material.opacity=0.5}else if(mode==='wrong'){ring.material.color.set(0xff3355);ring.material.opacity=1;sprite.material.opacity=1}else if(mode==='correct'){ring.material.color.set(0x44d864);ring.material.opacity=1;sprite.material.opacity=1}ring.material.needsUpdate=true;sprite.material.needsUpdate=true}
  function resetArrowsVisual(){currentArrows.forEach(g=>setArrowVisual(g,'idle'))}

  function showStep(i){currentArrows.forEach(group=>{group.children.forEach(ch=>{if(ch.geometry)ch.geometry.dispose();if(ch.material)ch.material.dispose()});scene.remove(group)});currentArrows.length=0;if(i>=QUIZ.steps.length){
      document.getElementById('question').textContent='Опрос завершён! Спасибо за ответы.';
      document.getElementById('quiz-controls').innerHTML='';
      if (FIX_CAMERA_DURING_QUESTIONS) freeLook = true; // вернуть свободный обзор
      quizActive=false;
      return
    }stepIndex=i;const step=QUIZ.steps[i];document.getElementById('question').textContent=step.question;step.options.forEach(opt=>{const group=new THREE.Group();const ring=createRing(0xffffff,0.6);const sprite=createArrowSprite(opt.color);sprite.position.y=0.8;group.add(ring);group.add(sprite);group.position.set(opt.pos[0],opt.pos[1],opt.pos[2]);group.position.y+=0.05;group.userData.opt=opt;currentArrows.push(group);scene.add(group)});resetArrowsVisual();moveCameraToStep(stepIndex)}

  const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2();
  function onClick(e){if(!quizActive||answerLock)return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(currentArrows,true);if(!hits.length)return;const group=hits[0].object.parent;const opt=group.userData.opt;answerLock=true;if(!opt.correct){currentArrows.forEach(g=>setArrowVisual(g,g===group?'wrong':'dim'));setTimeout(()=>{resetArrowsVisual();answerLock=false},700);return}currentArrows.forEach(g=>setArrowVisual(g,g===group?'correct':'dim'));setTimeout(()=>{showStep(stepIndex+1);answerLock=false},700)}

  function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x0f1620);scene.fog=new THREE.Fog(0x0f1620,1,150);
    const aspect=containerEl.clientWidth/containerEl.clientHeight;camera=new THREE.PerspectiveCamera(75,SAFE_ASPECT,0.1,1000);camera.position.set(0,1.6,5);
    renderer=new THREE.WebGLRenderer({antialias:true});
    // Размер сцены подгоняем под безопасное соотношение сторон, добавляя «поля» при необходимости
    fitRenderer();renderer.shadowMap.enabled=true;containerEl.appendChild(renderer.domElement);
    ambientLight=new THREE.AmbientLight(0xffffff,0.5);scene.add(ambientLight);directionalLight=new THREE.DirectionalLight(0xffffff,0.8);directionalLight.position.set(4,8,4);directionalLight.castShadow=true;scene.add(directionalLight);

    // Земля/сетка как ориентир (при необходимости можно удалить)
    const planeGeo=new THREE.PlaneGeometry(50,50);const planeMat=new THREE.MeshStandardMaterial({color:0x23324a,roughness:0.8,metalness:0.2});const plane=new THREE.Mesh(planeGeo,planeMat);plane.rotation.x=-Math.PI/2;plane.position.y=-1.5;plane.receiveShadow=true;scene.add(plane);const grid=new THREE.GridHelper(50,50,0xffffff,0xffffff);grid.position.y=-1.5+0.01;grid.material.opacity=0.15;grid.material.transparent=true;scene.add(grid);

    controls=new THREE.PointerLockControls(camera,renderer.domElement);scene.add(controls.getObject());// Лочим указатель мыши только если разрешён свободный обзор
    containerEl.addEventListener('click', ()=> { if (freeLook) controls.lock(); });renderer.domElement.addEventListener('click',onClick);
    window.addEventListener('resize',()=>{
      SAFE_ASPECT = computeSafeAspect();
      camera.aspect = SAFE_ASPECT;
      camera.updateProjectionMatrix();
      fitRenderer();
      if (quizActive) moveCameraToStep(stepIndex);
    });

    // Загрузчики с менеджером чтобы убрать оверлей
    const manager=new THREE.LoadingManager(()=>{document.getElementById('loading').style.display='none'});
    gltfLoader=new THREE.GLTFLoader(manager);const draco=new THREE.DRACOLoader();draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');gltfLoader.setDRACOLoader(draco);if(window.MeshoptDecoder){gltfLoader.setMeshoptDecoder(MeshoptDecoder)};const ktx2=new THREE.KTX2Loader(manager).setTranscoderPath('https://unpkg.com/three@0.139.2/examples/js/libs/basis/').detectSupport(renderer);gltfLoader.setKTX2Loader(ktx2);
    loadModel();animate()}

  function loadModel(){const modelUrl='model-compressed.glb';gltfLoader.load(modelUrl,(gltf)=>{model=gltf.scene;model.position.set(0,-1.5,0);model.traverse(ch=>{if(ch.isMesh){ch.castShadow=true;ch.receiveShadow=true}});scene.add(model);let road=model.getObjectByName('Road');if(!road){model.traverse(o=>{if(o.isMesh && /road|asphalt|дорога/i.test(o.name)){o.name='ground'}})}else{road.name='ground'}},undefined,(err)=>{console.warn('Не удалось загрузить модель',err)});}

  function animate(){requestAnimationFrame(animate);const delta=clock.getDelta();if(cameraTarget){const obj=controls.getObject();obj.position.lerp(cameraTarget,0.05);if(obj.position.distanceTo(cameraTarget)<0.05){obj.position.copy(cameraTarget);cameraTarget=null}}const baseSpeed=4;const moveSpeed=(keys.shift?12:baseSpeed)*delta;if(controls.isLocked){if(keys.w)controls.moveForward(moveSpeed);if(keys.s)controls.moveForward(-moveSpeed);if(keys.a)controls.moveRight(-moveSpeed);if(keys.d)controls.moveRight(moveSpeed);const obj=controls.getObject();if(keys.space)obj.position.y+=moveSpeed;if(keys.ctrl)obj.position.y-=moveSpeed}renderer.render(scene,camera)}

  function startQuiz(){
    quizActive=true;
    // Во время вопросов фиксируем камеру
    if (FIX_CAMERA_DURING_QUESTIONS) {
      freeLook = false;
      if (controls && controls.isLocked) controls.unlock();
    }
    document.getElementById('quiz-controls').innerHTML='';
    showStep(0);
  }

  window.addEventListener('keydown',e=>{if(e.code==='KeyW')keys.w=true;if(e.code==='KeyA')keys.a=true;if(e.code==='KeyS')keys.s=true;if(e.code==='KeyD')keys.d=true;if(e.code==='ShiftLeft'||e.code==='ShiftRight')keys.shift=true;if(e.code==='Space')keys.space=true;if(e.code==='ControlLeft'||e.code==='ControlRight')keys.ctrl=true});
  window.addEventListener('keyup',e=>{if(e.code==='KeyW')keys.w=false;if(e.code==='KeyA')keys.a=false;if(e.code==='KeyS')keys.s=false;if(e.code==='KeyD')keys.d=false;if(e.code==='ShiftLeft'||e.code==='ShiftRight')keys.shift=false;if(e.code==='Space')keys.space=false;if(e.code==='ControlLeft'||e.code==='ControlRight')keys.ctrl=false});

  window.addEventListener('load',init);
  document.getElementById('start-btn').addEventListener('click',startQuiz);
  </script>
</body>
</html>
