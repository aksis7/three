<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Quiz Demo — Driving School</title>
  <style>
    /* Общие стили для страницы и контейнеров */
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; }
    body { background:#0f1620; color:#fff; min-height:100vh; overflow:hidden; display:flex; flex-direction:column; }
    header { text-align:center; padding:12px 16px; background:rgba(255,255,255,.04); backdrop-filter:blur(4px); }
    h1 { font-size:22px; font-weight:700; letter-spacing:0.2px; }
    .subtitle { font-size:13px; opacity:.8; margin-top:4px; }
    .main { flex:1; display:flex; gap:20px; padding:20px; min-height:0; }
    #canvas-container { position:relative; flex:3; min-height:300px; border-radius:14px; overflow:hidden; background:rgba(255,255,255,.05); box-shadow:0 10px 30px rgba(0,0,0,.35) inset, 0 8px 32px rgba(0,0,0,.3); }
    #canvas-container canvas { display:block; }
    #quiz-panel { flex:1; display:flex; flex-direction:column; background:rgba(255,255,255,.05); border-radius:14px; padding:16px; gap:16px; }
    #question { font-size:16px; font-weight:600; line-height:1.3; }
    #quiz-controls { margin-top:auto; }
    #start-btn, #next-btn { padding:10px; border:none; border-radius:10px; background:linear-gradient(90deg,#ffb700,#ffe178); color:#222; font-weight:700; cursor:pointer; }
    #start-btn:hover, #next-btn:hover { transform:translateY(-2px); box-shadow:0 8px 16px rgba(255,223,0,.3); }
    .loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,.45); z-index:2; }
    .spinner { width:42px; height:42px; border:5px solid rgba(255,255,255,.15); border-top-color:#ffcc00; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(max-width:900px){ .main { flex-direction:column; } #canvas-container { min-height:50vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Интерактивный опрос на 3D‑сцене</h1>
    <div class="subtitle">Нажмите кнопку «Старт», чтобы увидеть варианты на дороге и ответить на вопрос.</div>
  </header>
  <div class="main">
    <div id="canvas-container">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Загрузка сцены…</div>
      </div>
    </div>
    <div id="quiz-panel">
      <div id="question">Нажмите «Старт», чтобы начать опрос</div>
      <div id="quiz-controls">
        <button id="start-btn">Старт</button>
      </div>
    </div>
  </div>

  <!-- Three.js r126 и вспомогательные скрипты -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.min.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
  // ========== Настройка 3D сцены ==========
  let scene, camera, renderer, controls;
  let ambientLight, directionalLight;
  let gltfLoader;
  let model = null;
  let quizActive = false;
  let currentArrows = [];
  let stepIndex = 0;
  const keys = { w:false, a:false, s:false, d:false, shift:false, space:false, ctrl:false };
  const clock = new THREE.Clock();
  const containerEl = document.getElementById('canvas-container');
  let answerLock = false; // чтобы игнорить повторные клики, пока подсветка играет

  // Структура опроса: каждый шаг содержит вопрос и список вариантов
  const QUIZ = {
    steps: [
      {
        question: 'Вы хотите продолжить движение прямо,какую полосу вы  выберите? ',
        options: [
          { id:'left',  pos: [-38.275, -1.520, -75.911], color:'#ff3b30', correct:true },
          { id:'forward', pos:[-41.325, -1.520, -75.007], color:'#ff3b30', correct:true },
          { id:'right', pos:[-44.346, -1.520, -75.106], color:'#ff3b30', correct:false }
        ]
      },
      {
        question: 'Вы хотите повернуть на перекрестке налево,какую полосу вы  выберите?',
        options: [
          { id:'left',  pos: [-38.667, -1.520, -47.591], color:'#ff3b30', correct:true },
          { id:'forward', pos:[-41.700, -1.520, -47.023], color:'#ff3b30', correct:false },
          { id:'right', pos:[-44.295, -1.520, -46.767], color:'#ff3b30', correct:false }
        ]
      },
      
      {
        question: 'Где нужно остановиться на красный сигнал светофора?',
        options: [
          { id:'stop_line', pos:[-32.442, -1.500, 22.350], color:'#4cd964', correct:true },
          { id:'traffic_light', pos:[-33.512, -1.520, 26.255], color:'#ff3b30', correct:false }
        ]
      }
    ]
  };
function addEnvironment(scene) {
  // пол (можете поставить y = 0)
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x0a3d62, roughness: 0.85, metalness: 0.15 })
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -2;          
  plane.receiveShadow = true;
  plane.name = 'ground';          
  scene.add(plane);

  // сетка-подложка для ориентира
  const grid = new THREE.GridHelper(40, 40, 0xffffff, 0xffffff);
  grid.position.y = -2;
  grid.material.opacity = 0.18;
  grid.material.transparent = true;
  scene.add(grid);

  return { plane, grid };
}

  // Функция создания стрелки в виде спрайта из SVG
  function createArrowSprite(color='#ff3b30') {
    const svg = encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>` +
      `<polygon points='50,10 90,60 70,60 70,90 30,90 30,60 10,60' fill='${color}'/>` +
      `</svg>`
    );
    const texture = new THREE.TextureLoader().load(`data:image/svg+xml;utf8,${svg}`);
    const material = new THREE.SpriteMaterial({ map: texture, transparent:true, depthWrite:false });
    return new THREE.Sprite(material);
  }

  // Подсветка вокруг стрелки
  function createRing(color=0xffffff, radius=0.5) {
    const geometry = new THREE.RingGeometry(radius*0.65, radius, 32);
    const material = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent:true, opacity:0.9 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.rotation.x = -Math.PI/2;
    return mesh;
  }

  // Отобразить текущий шаг
  function showStep(i) {
    // Удалить старые стрелки
    currentArrows.forEach(group => {
      group.children.forEach(child => { if (child.geometry) child.geometry.dispose(); if (child.material) child.material.dispose(); });
      scene.remove(group);
    });
    currentArrows.length = 0;
    // Если шагов больше нет, показать финал
    if (i >= QUIZ.steps.length) {
      document.getElementById('question').textContent = 'Опрос завершён! Спасибо за ответы.';
      document.getElementById('quiz-controls').innerHTML = '';
      quizActive = false;
      return;
    }
    stepIndex = i;
    const step = QUIZ.steps[i];
    document.getElementById('question').textContent = step.question;
    // Создаём группу стрелок по вариантам
    step.options.forEach(opt => {
      const group = new THREE.Group();
      const ring  = createRing(0xffffff, 0.6);
      const sprite = createArrowSprite(opt.color);
      sprite.position.y = 0.8;
      group.add(ring);
      group.add(sprite);
      group.position.set(opt.pos[0], opt.pos[1], opt.pos[2]);
      group.userData.opt = opt;
      currentArrows.push(group);
      scene.add(group);
    });
    resetArrowsVisual();
  }

  // Обработчик клика по сцене
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  function setArrowVisual(group, mode = 'idle') {
  const ring   = group.children[0];         // кольцо
  const sprite = group.children[1];         // спрайт-стрелка
  if (!ring || !sprite) return;

  if (mode === 'idle') {
    ring.material.color.set(0xffffff);
    ring.material.opacity = 0.9;
    sprite.material.opacity = 1.0;
  } else if (mode === 'dim') {
    ring.material.color.set(0x666666);
    ring.material.opacity = 0.6;
    sprite.material.opacity = 0.5;
  } else if (mode === 'wrong') {
    ring.material.color.set(0xff3355);
    ring.material.opacity = 1.0;
    sprite.material.opacity = 1.0;
  } else if (mode === 'correct') {
    ring.material.color.set(0x44d864);
    ring.material.opacity = 1.0;
    sprite.material.opacity = 1.0;
  }
  ring.material.needsUpdate = true;
  sprite.material.needsUpdate = true;
}

function resetArrowsVisual() {
  currentArrows.forEach(g => setArrowVisual(g, 'idle'));
}
  function onClick(event) {
  if (!quizActive || answerLock) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(currentArrows, true);
  if (!hits.length) return;

  // групповая стрелка (родитель кольца/спрайта)
  const group = hits[0].object.parent;
  const opt = group.userData.opt;

  // Включаем «лок», чтобы не ловить повторные клики в анимации
  answerLock = true;

  if (!opt.correct) {
    // Неверно: показали красный для выбранной и приглушили остальные...
    currentArrows.forEach(g => setArrowVisual(g, g === group ? 'wrong' : 'dim'));
    // ...и через 700 мс вернули всё в исходное
    setTimeout(() => { resetArrowsVisual(); answerLock = false; }, 700);
    return;
  }

  // Верно: зелёный + приглушить остальные и перейти дальше
  currentArrows.forEach(g => setArrowVisual(g, g === group ? 'correct' : 'dim'));
  setTimeout(() => {
    showStep(stepIndex + 1);
    answerLock = false;
  }, 700);
}



  // Инициализация сцены и загрузка модели
  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1620);
    scene.fog = new THREE.Fog(0x0f1620, 1, 150);
    scene.add(new THREE.AxesHelper(100));        // X=красн, Y=зелён, Z=син
    // или к самой модели, чтобы видеть её локальные оси:
    if (model) model.add(new THREE.AxesHelper(1.5));
    const aspect = containerEl.clientWidth / containerEl.clientHeight;
    camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
    camera.position.set(0, 1.6, 5);
    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(containerEl.clientWidth, containerEl.clientHeight);
    renderer.shadowMap.enabled = true;
    containerEl.appendChild(renderer.domElement);
    // Свет
    ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(4, 8, 4);
    directionalLight.castShadow = true;
    scene.add(directionalLight);
    // Плоскость земли

  //coord
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let pickMode = false;

  const probe = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 24, 24),
    new THREE.MeshStandardMaterial({ color: 0xff00aa, emissive: 0x220011 })
  );
  probe.visible = false;
  scene.add(probe);

    const planeGeo = new THREE.PlaneGeometry(50, 50);
    const planeMat = new THREE.MeshStandardMaterial({ color:0x23324a, roughness:0.8, metalness:0.2 });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI/2;
    plane.position.y = -1.5;
    plane.receiveShadow = true;
    scene.add(plane);
    // Сетка
    const grid = new THREE.GridHelper(50, 50, 0xffffff, 0xffffff);
    grid.position.y = -1.5 + 0.01;
    grid.material.opacity = 0.15;
    grid.material.transparent = true;
    scene.add(grid);
    // Pointer Lock Controls для свободной навигации
    controls = new THREE.PointerLockControls(camera, renderer.domElement);
    scene.add(controls.getObject());
    containerEl.addEventListener('click', () => controls.lock());
    // Слушаем клик по канвасу
    renderer.domElement.addEventListener('click', onClick);
    // Клавиатура для перемещения
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') keys.w = true;
      if (e.code === 'KeyA') keys.a = true;
      if (e.code === 'KeyS') keys.s = true;
      if (e.code === 'KeyD') keys.d = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
      if (e.code === 'Space') keys.space = true;
      if (e.code === 'ControlLeft' || e.code === 'ControlRight') keys.ctrl = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') keys.w = false;
      if (e.code === 'KeyA') keys.a = false;
      if (e.code === 'KeyS') keys.s = false;
      if (e.code === 'KeyD') keys.d = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
      if (e.code === 'Space') keys.space = false;
      if (e.code === 'ControlLeft' || e.code === 'ControlRight') keys.ctrl = false;
    });
    // Загрузчик моделей
    gltfLoader = new THREE.GLTFLoader();
    loadModel();
    animate();
  }

  // Загрузить внешний GLB. Если файл отсутствует, сцена будет пустой
  function loadModel() {
    const modelUrl = 'model.glb';
    gltfLoader.load(
      modelUrl,
      (gltf) => {
        model = gltf.scene;
        model.position.set(0, -1.5, 0);
        model.traverse((child) => {
          if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
        });
        scene.add(model);
        // === Пометить дорогу как цель для луча ===
        let road = model.getObjectByName('Road'); // если знаете точное имя
        if (!road) {
          // или ищем по части имени
          model.traverse(o => {
            if (o.isMesh && /road|asphalt|дорога/i.test(o.name)) {
              o.name = 'ground';
            }
          });
        } else {
          road.name = 'ground';
        }
      },
      undefined,
      (error) => { console.warn('Не удалось загрузить модель', error); }
    );
    document.getElementById('loading').style.display = 'none';
  }

  // Анимация
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    // Движение свободной камерой
    const baseSpeed = 4;
    const moveSpeed = (keys.shift ? 12 : baseSpeed) * delta;
    if (controls.isLocked) {
      if (keys.w) controls.moveForward(moveSpeed);
      if (keys.s) controls.moveForward(-moveSpeed);
      if (keys.a) controls.moveRight(-moveSpeed);
      if (keys.d) controls.moveRight(moveSpeed);
      const obj = controls.getObject();
      if (keys.space) obj.position.y += moveSpeed;
      if (keys.ctrl)  obj.position.y -= moveSpeed;
    }
    renderer.render(scene, camera);
  }

  // Запуск опроса
  function startQuiz() {
    quizActive = true;
    document.getElementById('quiz-controls').innerHTML = '';
    showStep(0);
  }

  // Инициализируем после загрузки страницы
  window.addEventListener('load', init);
  document.getElementById('start-btn').addEventListener('click', startQuiz);
  </script>
</body>
</html>
